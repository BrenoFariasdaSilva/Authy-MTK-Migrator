name: Android MTK migration tests
on:
  push:
    paths:
      - 'android_mtk/**'
      - 'tests/test_android_mtk.py'
      - 'requirements.txt'
      - '.github/workflows/android-mtk-tests.yml'
  pull_request:
    paths:
      - 'android_mtk/**'
      - 'tests/test_android_mtk.py'
      - 'requirements.txt'
      - '.github/workflows/android-mtk-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic tests (no hardware or real secrets)
        run: python -m unittest discover -s tests -p test_android_mtk.py -v
